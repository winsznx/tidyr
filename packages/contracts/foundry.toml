[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["*"]
fs_permissions = [{ access = "read", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
monad_mainnet = "${MONAD_RPC_URL}"

[etherscan]
monad_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 143 }
